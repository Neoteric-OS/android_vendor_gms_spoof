name: Update Random PIF

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-pif:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run PIF Update Script
        run: bash update_random_pif.sh

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gms_certified_props.json CertifiedPropsOverlay/res/values/config.xml
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Update certified props [skip ci]"
            git push
          fi
